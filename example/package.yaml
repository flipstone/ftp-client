name:                example
version:             0.1.0.0
homepage:            https://github.com/flipstone/ftp-client
license:             BSD3
license-file:        LICENSE
author:              Author name here
maintainer:          example@example.com
copyright:           2017 Author name here
category:            Web

git: https://github.com/flipstone/ftp-client

executables:
  example-exe:
    main: Main.hs
    source-dirs: app
    language: Haskell2010
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base
      - ftp-client
      - ftp-client-conduit
      - conduit
      - bytestring
      - containers

tests:
  example-test:
    main: Spec.hs
    source-dirs: test
    language: Haskell2010
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base
