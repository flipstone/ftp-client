<<: !include stack-base.yaml

resolver: lts-22.44
# henforcer is not in any snapshot. It is only active on GHC >= 9.6, so the
# 9.2 and 9.4 rungs do not carry it.
extra-deps:
  - henforcer-1.0.0.1
  - pollock-0.1.0.3
  # lts-22 additionally lacks henforcer's config parser and its dependency
  - tomland-1.3.3.3
  - validation-selective-0.2.0.0
