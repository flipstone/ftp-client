name:                ftp-client
version:             0.6.0.0
synopsis:            Transfer files with FTP and FTPS
description:         ftp-client is a library for communicating with an FTP server. It works over both a clear channel or TLS.
homepage:            https://github.com/flipstone/ftp-client
license:             PublicDomain
license-file:        LICENSE
author:              Megan Robinson
maintainer:          Flipstone Technology Partners
category:            Web

tested-with:
  - GHC == 9.2.8
  - GHC == 9.4.8
  - GHC == 9.6.7
  - GHC == 9.8.4
  - GHC == 9.10.3
  - GHC == 9.12.4

extra-source-files:
  - README.md
  - CHANGELOG.md
  # A compile time input whenever the ci flag turns the henforcer plugin on,
  # so an sdist without it would build without the rules it configures.
  - henforcer.toml

git: https://github.com/flipstone/ftp-client

flags:
  ci:
    description: More strict ghc options used for development and ci, not intended for end-use.
    manual: true
    default: false

library:
  source-dirs: src
  exposed-modules:
    - Network.FTP.Client
  language: Haskell2010
  default-extensions:
    - OverloadedStrings
  dependencies:
    - base >= 4.16 && < 5
    - bytestring >= 0.10.8.2 && < 0.13
    - network >= 2.6.3.6 && < 3.3
    - attoparsec >= 0.10 && < 0.15
    - crypton-connection >= 0.3 && < 0.5
    - exceptions >= 0.10.3 && < 0.11
    - containers >= 0.5.11.0 && < 0.8
    - data-default-class >= 0.1.2.0 && < 0.3
  when:
    - condition: flag(ci)
      ghc-options:
        - -O2
        - -Wall
        - -Werror
        - -Wcompat
        - -Widentities
        - -Winvalid-haddock
        - -Wmissing-local-signatures
        - -Wmissing-export-lists
        - -Wpartial-fields
        - -Wmissed-specialisations
        - -Wno-implicit-prelude
        - -Wno-safe
        - -Wno-unsafe
        - -Wunused-packages
      when:
        # Previously the guidance was to always use ticked constructors for type
        # constructors, but that guidance has been reversed, so we turn the
        # warning off in older compilers.
        - condition: impl (ghc <= 9.3)
          ghc-options:
            - -Wno-unticked-promoted-constructors
        - condition: impl (ghc >= 9.4)
          ghc-options:
            - -Wimplicit-lift
            - -Woperator-whitespace
            - -Wredundant-bang-patterns
            - -Wredundant-strictness-flags
        - condition: impl (ghc >= 9.8)
          ghc-options:
            - -Wincomplete-export-warnings
            - -Wmissing-poly-kind-signatures
            - -Wterm-variable-capture
        - condition: impl (ghc >= 9.10)
          ghc-options:
            - -Wdefaulted-exception-context
        - condition: impl (ghc >= 9.6)
          dependencies:
            - henforcer
          ghc-options:
            - -fplugin Henforcer

tests:
  ftp-client-test:
    main: test.hs
    source-dirs: test
    language: Haskell2010
    dependencies:
      - base >= 4.16 && < 5
      - bytestring >= 0.10.8.2 && < 0.13
      - crypton-connection >= 0.3 && < 0.5
      - directory >= 1.3 && < 1.4
      - hspec >= 2.7
      - ftp-client
    when:
      - condition: flag(ci)
        then:
          ghc-options:
            - -threaded
            - -rtsopts
            - -with-rtsopts=-N
            - -Wall
            - -Werror
            - -Wcompat
            - -Widentities
            - -Winvalid-haddock
            - -Wmissing-local-signatures
            - -Wmissing-export-lists
            - -Wpartial-fields
            - -Wmissed-specialisations
            - -Wno-implicit-prelude
            - -Wno-safe
            - -Wno-unsafe
          when:
            # Previously the guidance was to always use ticked constructors for type
            # constructors, but that guidance has been reversed, so we turn the
            # warning off in older compilers.
            - condition: impl (ghc <= 9.3)
              ghc-options:
                - -Wno-unticked-promoted-constructors
            - condition: impl (ghc >= 9.4)
              ghc-options:
                - -Wimplicit-lift
                - -Woperator-whitespace
                - -Wredundant-bang-patterns
                - -Wredundant-strictness-flags
            - condition: impl (ghc >= 9.8)
              ghc-options:
                - -Wincomplete-export-warnings
                - -Wmissing-poly-kind-signatures
                - -Wterm-variable-capture
            - condition: impl (ghc >= 9.10)
              ghc-options:
                - -Wdefaulted-exception-context
        else:
          ghc-options:
            - -threaded
            - -rtsopts
            - -with-rtsopts=-N
