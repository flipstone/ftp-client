name:                ftp-client-conduit
version:             0.5.0.7
synopsis:            Transfer file with FTP and FTPS with Conduit
description:         ftp-client is a library for communicating with an FTP server. It works over both a clear channel or TLS. ftp-client-conduit uses conduit to stream files and data in constant space.
homepage:            https://github.com/flipstone/ftp-client
license:             PublicDomain
license-file:        LICENSE
author:              Megan Robinson
maintainer:          Flipstone Technology Partners
category:            Web

tested-with:
  - GHC == 9.2.8
  - GHC == 9.4.8
  - GHC == 9.6.7
  - GHC == 9.8.4
  - GHC == 9.10.3
  - GHC == 9.12.4

extra-source-files:
  - README.md
  - CHANGELOG.md

git: https://github.com/flipstone/ftp-client

flags:
  ci:
    description: More strict ghc options used for development and ci, not intended for end-use.
    manual: true
    default: false

library:
  source-dirs: src
  exposed-modules:
    - Network.FTP.Client.Conduit
  language: Haskell2010
  default-extensions:
    - OverloadedStrings
  dependencies:
    - base >= 4.16 && < 5
    - ftp-client == 0.5.*
    - conduit >= 1.3 && < 1.4
    - bytestring >= 0.10.8.2 && < 0.13
    - resourcet >= 1.2 && < 1.4
    - crypton-connection >= 0.3 && < 0.5
    - exceptions >= 0.10.3 && < 0.11
  when:
    - condition: flag(ci)
      ghc-options:
        - -O2
        - -Wall
        - -Werror
        - -Wcompat
        - -Widentities
        - -Winvalid-haddock
        - -Wmissing-local-signatures
        - -Wmissing-export-lists
        - -Wpartial-fields
        - -Wmissed-specialisations
        - -Wno-implicit-prelude
        - -Wno-safe
        - -Wno-unsafe
        - -Wunused-packages
      when:
        # Previously the guidance was to always use ticked constructors for type
        # constructors, but that guidance has been reversed, so we turn the
        # warning off in older compilers.
        - condition: impl (ghc <= 9.3)
          ghc-options:
            - -Wno-unticked-promoted-constructors
        - condition: impl (ghc >= 9.4)
          ghc-options:
            - -Wimplicit-lift
            - -Woperator-whitespace
            - -Wredundant-bang-patterns
            - -Wredundant-strictness-flags
        - condition: impl (ghc >= 9.8)
          ghc-options:
            - -Wincomplete-export-warnings
            - -Wmissing-poly-kind-signatures
            - -Wterm-variable-capture
        - condition: impl (ghc >= 9.10)
          ghc-options:
            - -Wdefaulted-exception-context

tests:
  ftp-conduit-test:
    main: Spec.hs
    source-dirs: test
    language: Haskell2010
    dependencies:
      - base >= 4.16 && < 5
      - ftp-client-conduit
    when:
      - condition: flag(ci)
        then:
          ghc-options:
            - -threaded
            - -rtsopts
            - -with-rtsopts=-N
            - -Wall
            - -Werror
            - -Wcompat
            - -Widentities
            - -Winvalid-haddock
            - -Wmissing-local-signatures
            - -Wmissing-export-lists
            - -Wpartial-fields
            - -Wmissed-specialisations
            - -Wno-implicit-prelude
            - -Wno-safe
            - -Wno-unsafe
          when:
            - condition: impl (ghc <= 9.3)
              ghc-options:
                - -Wno-unticked-promoted-constructors
            - condition: impl (ghc >= 9.4)
              ghc-options:
                - -Wimplicit-lift
                - -Woperator-whitespace
                - -Wredundant-bang-patterns
                - -Wredundant-strictness-flags
            - condition: impl (ghc >= 9.8)
              ghc-options:
                - -Wincomplete-export-warnings
                - -Wmissing-poly-kind-signatures
                - -Wterm-variable-capture
            - condition: impl (ghc >= 9.10)
              ghc-options:
                - -Wdefaulted-exception-context
        else:
          ghc-options:
            - -threaded
            - -rtsopts
            - -with-rtsopts=-N
